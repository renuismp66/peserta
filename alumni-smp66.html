<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buku Kas Reuni — Alumni SMP 66 Angkatan 1996</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFE8D8;
    --paper-2:#E7DEC8;
    --ink:#1F2A44;
    --ink-soft:#4A5470;
    --maroon:#7A2E2E;
    --maroon-dark:#5E2222;
    --gold:#B8863B;
    --line:#C9BFA5;
    --green:#2E5E3E;
    --white:#FBF9F2;
    --shadow: 0 2px 10px rgba(31,42,68,0.12);
  }
  *{box-sizing:border-box;}
  body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Source Sans 3',sans-serif;}
  .display{font-family:'Lora',serif;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  body{
    background-image:
      repeating-linear-gradient(180deg, transparent, transparent 39px, var(--line) 40px),
      linear-gradient(var(--paper), var(--paper));
    background-attachment:local;
  }

  #app{min-height:100vh;}

  /* ---------- LOGIN ---------- */
  .login-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .login-card{
    background:var(--white); border:1px solid var(--line); box-shadow:var(--shadow);
    width:100%; max-width:420px; padding:36px 32px; position:relative; border-radius:2px;
  }
  .login-card::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:6px; background:var(--maroon); }
  .stempel{
    width:74px; height:74px; border-radius:50%; border:3px solid var(--maroon); color:var(--maroon);
    display:flex; align-items:center; justify-content:center; text-align:center; font-family:'Lora',serif;
    font-weight:700; font-size:11px; letter-spacing:0.5px; transform:rotate(-8deg); margin:0 auto 18px; opacity:0.85;
  }
  .login-card h1{ font-size:22px; text-align:center; margin:0 0 4px; letter-spacing:0.2px; }
  .login-sub{ text-align:center; color:var(--ink-soft); font-size:13.5px; margin:0 0 26px; }
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.5px;}
  .field input, .field select{
    width:100%; padding:10px 12px; border:1px solid var(--line); background:var(--paper); border-radius:2px;
    font-family:'Source Sans 3',sans-serif; font-size:14.5px; color:var(--ink);
  }
  .field input:focus, .field select:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px; cursor:pointer;
    border:none; border-radius:2px; padding:10px 18px; font-size:14px; font-weight:600;
    font-family:'Source Sans 3',sans-serif; transition:transform .08s ease, filter .12s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--maroon); color:var(--white);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-gold{background:var(--gold); color:var(--white);}
  .btn-gold:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent; color:var(--ink); border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--paper-2);}
  .btn-danger{background:#8E3B3B; color:var(--white);}
  .btn-danger:hover{filter:brightness(1.1);}
  .btn-block{width:100%;}
  .btn-sm{padding:6px 12px; font-size:12.5px;}
  .login-error{
    background:#F6E4E0; border:1px solid #D9A79C; color:var(--maroon-dark); font-size:13px;
    padding:9px 12px; border-radius:2px; margin-bottom:14px;
  }
  .hint-box{ margin-top:22px; padding-top:16px; border-top:1px dashed var(--line); font-size:12px; color:var(--ink-soft); line-height:1.6; }
  .hint-box b{color:var(--ink);}

  /* ---------- HEADER ---------- */
  header.top{
    background:var(--ink); color:var(--white); padding:16px 28px; display:flex; align-items:center;
    justify-content:space-between; box-shadow:var(--shadow); flex-wrap:wrap; gap:12px;
  }
  header.top .brand{display:flex; align-items:center; gap:12px;}
  header.top .brand .badge{
    width:38px; height:38px; border-radius:50%; border:2px solid var(--gold); color:var(--gold);
    display:flex; align-items:center; justify-content:center; font-family:'Lora',serif; font-weight:700; font-size:13px;
  }
  header.top h2{margin:0; font-size:16px; font-weight:600; letter-spacing:0.2px;}
  header.top .sub{font-size:11.5px; color:#B9C0D6; margin-top:1px;}
  .who{display:flex; align-items:center; gap:12px; font-size:13px; flex-wrap:wrap;}
  .role-pill{ padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; letter-spacing:0.4px; text-transform:uppercase; }
  .role-pill.admin{background:var(--gold); color:#3A2A05;}
  .role-pill.user{background:#4C5A85; color:var(--white);}

  main{padding:26px 28px 60px; max-width:1280px; margin:0 auto;}

  .summary-row{display:flex; gap:18px; flex-wrap:wrap; margin-bottom:24px;}
  .sum-card{
    flex:1; min-width:200px; background:var(--white); border:1px solid var(--line); border-radius:2px;
    padding:16px 18px; box-shadow:var(--shadow); position:relative; overflow:hidden;
  }
  .sum-card .label{font-size:11.5px; text-transform:uppercase; letter-spacing:0.6px; color:var(--ink-soft); font-weight:600;}
  .sum-card .value{font-family:'Lora',serif; font-size:26px; font-weight:700; color:var(--maroon); margin-top:4px;}
  .sum-card::after{ content:"✓"; position:absolute; right:10px; top:8px; font-size:34px; color:var(--gold); opacity:0.12; font-family:'Lora',serif; }

  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px;}
  .toolbar h3{margin:0; font-size:18px; display:flex; align-items:center; gap:8px;}
  .search-box input{ padding:9px 12px; border:1px solid var(--line); border-radius:2px; background:var(--white); min-width:220px; font-size:13.5px; }
  .toolbar-actions{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}

  .ledger{ background:var(--white); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:2px; overflow-x:auto; position:relative; }
  .ledger::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:5px; background:var(--maroon); z-index:2; }
  table{width:100%; border-collapse:collapse; min-width:1240px;}
  thead th{
    background:var(--ink); color:var(--white); text-align:left; padding:12px 14px; font-size:11.5px;
    text-transform:uppercase; letter-spacing:0.5px; font-weight:600; white-space:nowrap;
  }
  tbody td{ padding:11px 14px; font-size:13.5px; border-bottom:1px solid var(--line); vertical-align:middle; }
  tbody tr:hover{background:#F7F2E4;}
  tbody tr:last-child td{border-bottom:none;}
  td.num, th.num{font-family:'IBM Plex Mono',monospace; white-space:nowrap;}
  td.who-cell{font-size:12px; color:var(--ink-soft); white-space:nowrap;}
  td.actions{white-space:nowrap;}
  .attach-btn{
    color:var(--maroon); font-weight:600; font-size:12.5px; border:1px solid var(--maroon); background:transparent;
    border-radius:20px; padding:4px 10px; cursor:pointer;
  }
  .attach-btn:hover{background:var(--maroon); color:var(--white);}
  .no-attach{color:#9A9A8C; font-size:12px; font-style:italic;}
  .empty-state{padding:50px 20px; text-align:center; color:var(--ink-soft);}
  .empty-state .big{font-family:'Lora',serif; font-size:20px; color:var(--ink); margin-bottom:6px;}
  .icon-btn{ border:none; background:transparent; cursor:pointer; padding:5px 8px; border-radius:3px; font-size:13px; margin-right:2px; }
  .icon-btn.edit{color:var(--gold);}
  .icon-btn.edit:hover{background:#F3E7CF;}
  .icon-btn.del{color:#8E3B3B;}
  .icon-btn.del:hover{background:#F6E4E0;}

  /* ---------- MODAL ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(31,42,68,0.55); display:flex; align-items:flex-start; justify-content:center;
    padding:40px 16px; overflow-y:auto; z-index:50;
  }
  .modal{
    background:var(--white); width:100%; max-width:640px; border-radius:2px; box-shadow:0 10px 40px rgba(0,0,0,0.25);
    padding:28px 30px; position:relative;
  }
  .modal.wide{max-width:760px;}
  .modal h3{margin:0 0 4px; font-size:19px;}
  .modal .modal-sub{color:var(--ink-soft); font-size:13px; margin-bottom:20px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px 16px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:22px; border-top:1px solid var(--line); padding-top:18px;}
  .close-x{position:absolute; right:16px; top:14px; background:none; border:none; font-size:20px; cursor:pointer; color:var(--ink-soft);}
  .file-preview{margin-top:8px; font-size:12px; color:var(--ink-soft);}

  /* attachment lightbox */
  .attach-view{text-align:center;}
  .attach-view img{max-width:100%; max-height:65vh; border:1px solid var(--line); border-radius:2px; box-shadow:var(--shadow);}
  .attach-view embed{width:100%; height:65vh; border:1px solid var(--line);}
  .attach-view .meta{font-size:12px; color:var(--ink-soft); margin-top:10px;}

  /* activity log */
  .log-table{width:100%; border-collapse:collapse; font-size:13px;}
  .log-table th{ text-align:left; padding:8px 10px; background:var(--paper-2); border-bottom:1px solid var(--line); font-size:11px; text-transform:uppercase; letter-spacing:0.4px; color:var(--ink-soft); position:sticky; top:0;}
  .log-table td{ padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top;}
  .log-action{font-weight:700; font-size:11px; padding:2px 8px; border-radius:10px; display:inline-block;}
  .log-action.tambah{background:#E1EEE3; color:var(--green);}
  .log-action.update{background:#F3E7CF; color:#7A5A17;}
  .log-action.hapus{background:#F6E4E0; color:var(--maroon-dark);}
  .log-scroll{max-height:60vh; overflow-y:auto; border:1px solid var(--line);}

  .toast{
    position:fixed; bottom:22px; right:22px; background:var(--ink); color:var(--white); padding:12px 18px; border-radius:3px;
    font-size:13.5px; box-shadow:var(--shadow); z-index:99; display:flex; align-items:center; gap:8px; animation:fadein .2s ease;
  }
  @keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .manage-users{ background:var(--white); border:1px solid var(--line); border-radius:2px; padding:18px 20px; margin-top:26px; box-shadow:var(--shadow); }
  .manage-users h3{margin-top:0;}
  .user-row{display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px dashed var(--line); font-size:13.5px; flex-wrap:wrap; gap:8px;}
  .user-row:last-child{border-bottom:none;}

  footer.foot{text-align:center; padding:30px 16px 40px; color:var(--ink-soft); font-size:12px;}

  @media (max-width:640px){
    .grid2{grid-template-columns:1fr;}
    header.top{padding:14px 16px;}
    main{padding:18px 14px 50px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.js"></script>
<script>
(function(){
  "use strict";

  const STORAGE_KEY = "smp66_alumni_dbv1";
  const attachKey = (id) => `smp66_attach_${id}`;

  let SQL = null;
  let db = null;
  let session = null; // {username, role}
  let pendingAttachment = null; // {name, dataUrl}
  let searchTerm = "";
  let saving = false;

  const app = document.getElementById("app");

  function toast(msg){
    const t = document.createElement("div");
    t.className = "toast";
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(()=>t.remove(), 2600);
  }

  function fmtRupiah(n){ n = Number(n)||0; return "Rp " + n.toLocaleString("id-ID"); }
  function fmtDate(d){
    if(!d) return "-";
    const dt = new Date(d+"T00:00:00");
    if(isNaN(dt)) return d;
    return dt.toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"});
  }
  function fmtDateTime(ts){
    if(!ts) return "-";
    const dt = new Date(ts.replace(" ","T")+"Z");
    if(isNaN(dt)) return ts;
    return dt.toLocaleString("id-ID",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"});
  }
  function escapeHtml(s){
    return (s??"").toString().replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  }

  // ---------------- PERSISTENCE ----------------
  async function persist(){
    saving = true;
    updateSaveIndicator();
    try{
      const bytes = db.export();
      let binary = "";
      const chunk = 8192;
      for(let i=0;i<bytes.length;i+=chunk){
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
      }
      const b64 = btoa(binary);
      const res = await window.storage.set(STORAGE_KEY, b64, true);
      if(!res){
        toast("⚠️ Gagal menyimpan perubahan ke penyimpanan. Coba lagi.");
      }
    }catch(e){
      console.error("Persist error", e);
      toast("⚠️ Gagal menyimpan perubahan: " + (e && e.message ? e.message : "unknown error"));
    }finally{
      saving = false;
      updateSaveIndicator();
    }
  }
  function updateSaveIndicator(){
    const el = document.getElementById("saveIndicator");
    if(el) el.textContent = saving ? "Menyimpan..." : "Tersimpan";
  }

  function seedSchema(){
    db.run(`
      CREATE TABLE users(
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        username TEXT UNIQUE NOT NULL,
        password TEXT NOT NULL,
        role TEXT NOT NULL CHECK(role IN ('admin','user')),
        created_at TEXT DEFAULT CURRENT_TIMESTAMP
      );
      CREATE TABLE peserta(
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        nama_alumni TEXT NOT NULL,
        nama_pengirim TEXT,
        tgl_transaksi TEXT,
        tgl_kirim_wag TEXT,
        no_transaksi TEXT,
        total_pembayaran REAL DEFAULT 0,
        total_peserta INTEGER DEFAULT 1,
        has_attachment INTEGER DEFAULT 0,
        attachment_name TEXT,
        created_by TEXT,
        updated_by TEXT,
        created_at TEXT DEFAULT CURRENT_TIMESTAMP,
        updated_at TEXT DEFAULT CURRENT_TIMESTAMP
      );
      CREATE TABLE activity_log(
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        ts TEXT DEFAULT CURRENT_TIMESTAMP,
        username TEXT,
        action TEXT,
        nama_alumni TEXT,
        detail TEXT
      );
    `);
    db.run(`INSERT INTO users(username,password,role) VALUES (?,?,?)`, ["admin","admin123","admin"]);
    db.run(`INSERT INTO users(username,password,role) VALUES (?,?,?)`, ["alumni","alumni123","user"]);
  }

  // Migrate older databases (before log/attribution/attachment-in-storage features existed)
  async function runMigrations(){
    const tableNames = q("SELECT name FROM sqlite_master WHERE type='table'").map(r=>r.name);

    if(!tableNames.includes("activity_log")){
      run(`CREATE TABLE activity_log(
        id INTEGER PRIMARY KEY AUTOINCREMENT,
        ts TEXT DEFAULT CURRENT_TIMESTAMP,
        username TEXT,
        action TEXT,
        nama_alumni TEXT,
        detail TEXT
      )`);
    }

    if(tableNames.includes("peserta")){
      const cols = q("PRAGMA table_info(peserta)").map(c=>c.name);
      const ensure = (name, ddl) => { if(!cols.includes(name)) run(`ALTER TABLE peserta ADD COLUMN ${ddl}`); };
      ensure("has_attachment", "has_attachment INTEGER DEFAULT 0");
      ensure("attachment_name", "attachment_name TEXT");
      ensure("created_by", "created_by TEXT");
      ensure("updated_by", "updated_by TEXT");

      // migrate old inline base64 attachments (legacy 'attachment' column) into separate storage keys
      if(cols.includes("attachment")){
        const legacyRows = q("SELECT id, attachment, attachment_name FROM peserta WHERE attachment IS NOT NULL AND attachment != ''");
        for(const r of legacyRows){
          try{
            await window.storage.set(attachKey(r.id), r.attachment, true);
            run("UPDATE peserta SET has_attachment=1, attachment_name=?, attachment=NULL WHERE id=?", [r.attachment_name||"bukti", r.id]);
          }catch(e){ console.error("Migrasi attachment gagal untuk id="+r.id, e); }
        }
      }
    }
  }

  async function initDb(){
    SQL = await initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/${f}` });
    let loaded = null;
    try{
      const res = await window.storage.get(STORAGE_KEY, true);
      if(res && res.value) loaded = res.value;
    }catch(e){ /* key belum ada, tidak masalah */ }

    if(loaded){
      try{
        const binary = atob(loaded);
        const bytes = new Uint8Array(binary.length);
        for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
        db = new SQL.Database(bytes);
      }catch(e){
        console.error("Gagal memuat database tersimpan, membuat baru", e);
        db = new SQL.Database();
        seedSchema();
        await persist();
        return;
      }
      await runMigrations();
      await persist();
    }else{
      db = new SQL.Database();
      seedSchema();
      await persist();
    }
  }

  function q(sql, params=[]){
    const stmt = db.prepare(sql);
    stmt.bind(params);
    const rows = [];
    while(stmt.step()) rows.push(stmt.getAsObject());
    stmt.free();
    return rows;
  }
  function run(sql, params=[]){ db.run(sql, params); }

  function logActivity(action, namaAlumni, detail){
    run("INSERT INTO activity_log(username, action, nama_alumni, detail) VALUES (?,?,?,?)",
      [session ? session.username : "system", action, namaAlumni||"", detail||""]);
  }

  // ---------------- RENDER: LOGIN ----------------
  function renderLogin(errorMsg){
    app.innerHTML = `
      <div class="login-wrap">
        <div class="login-card">
          <div class="stempel">SMP 66<br>ANGK. 96</div>
          <h1 class="display">Buku Kas Reuni</h1>
          <p class="login-sub">Alumni SMP Negeri 66 &middot; Angkatan 1996</p>
          ${errorMsg ? `<div class="login-error">${escapeHtml(errorMsg)}</div>` : ""}
          <form id="loginForm">
            <div class="field">
              <label>Username</label>
              <input type="text" id="loginUser" autocomplete="username" required>
            </div>
            <div class="field">
              <label>Password</label>
              <input type="password" id="loginPass" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Masuk</button>
          </form>
          <div class="hint-box">
            <b>Akun demo</b><br>
            Admin (kelola data): <span class="mono">admin / admin123</span><br>
            User biasa (lihat saja): <span class="mono">alumni / alumni123</span><br>
            Password akun demo dapat diubah oleh admin melalui menu Kelola User.
          </div>
        </div>
      </div>
    `;
    document.getElementById("loginForm").addEventListener("submit", (e)=>{
      e.preventDefault();
      const u = document.getElementById("loginUser").value.trim();
      const p = document.getElementById("loginPass").value;
      const rows = q("SELECT * FROM users WHERE username=? AND password=?", [u,p]);
      if(rows.length===0){
        renderLogin("Username atau password salah. Silakan coba lagi.");
        return;
      }
      session = { username: rows[0].username, role: rows[0].role };
      renderDashboard();
    });
  }

  // ---------------- RENDER: DASHBOARD ----------------
  function renderDashboard(){
    const isAdmin = session.role === "admin";
    const all = q("SELECT * FROM peserta ORDER BY tgl_transaksi DESC, id DESC");
    const totalDana = all.reduce((s,r)=>s+Number(r.total_pembayaran||0),0);
    const totalPeserta = all.reduce((s,r)=>s+Number(r.total_peserta||0),0);
    const totalTransaksi = all.length;

    app.innerHTML = `
      <header class="top">
        <div class="brand">
          <div class="badge">66</div>
          <div>
            <h2 class="display">Buku Kas Reuni Alumni SMP 66</h2>
            <div class="sub">Angkatan 1996 &middot; Rekap Pembayaran Peserta &middot; <span id="saveIndicator">Tersimpan</span></div>
          </div>
        </div>
        <div class="who">
          <span class="role-pill ${isAdmin?'admin':'user'}">${isAdmin?'Admin':'Lihat Saja'}</span>
          <span>${escapeHtml(session.username)}</span>
          <button class="btn btn-ghost" id="logoutBtn">Keluar</button>
        </div>
      </header>
      <main>
        <div class="summary-row">
          <div class="sum-card">
            <div class="label">Total Dana Terkumpul</div>
            <div class="value mono">${fmtRupiah(totalDana)}</div>
          </div>
          <div class="sum-card">
            <div class="label">Total Peserta Terdaftar</div>
            <div class="value mono">${totalPeserta}</div>
          </div>
          <div class="sum-card">
            <div class="label">Jumlah Transaksi</div>
            <div class="value mono">${totalTransaksi}</div>
          </div>
        </div>

        <div class="toolbar">
          <h3>📖 Daftar Pembayaran Peserta</h3>
          <div class="toolbar-actions">
            <div class="search-box">
              <input type="text" id="searchInput" placeholder="Cari nama alumni / no. transaksi..." value="${escapeHtml(searchTerm)}">
            </div>
            <button class="btn btn-ghost" id="logBtn">🕒 Log Aktivitas</button>
            ${isAdmin ? `<button class="btn btn-primary" id="addBtn">+ Tambah Data</button>` : ""}
          </div>
        </div>

        <div class="ledger" id="ledgerWrap"></div>

        ${isAdmin ? `<div class="manage-users" id="manageUsersBox"></div>` : ""}
      </main>
      <footer class="foot">Data disimpan otomatis (SQLite) dan tetap tersimpan meski halaman di-refresh &middot; Buku Kas Reuni SMP 66 Angkatan 1996</footer>
    `;

    document.getElementById("logoutBtn").addEventListener("click", ()=>{ session = null; renderLogin(); });
    document.getElementById("searchInput").addEventListener("input", (e)=>{ searchTerm = e.target.value; renderTable(); });
    document.getElementById("logBtn").addEventListener("click", openActivityLog);
    if(isAdmin){
      document.getElementById("addBtn").addEventListener("click", ()=>openModal(null));
      renderManageUsers();
    }
    renderTable();
  }

  function renderTable(){
    const wrap = document.getElementById("ledgerWrap");
    if(!wrap) return;
    const isAdmin = session.role === "admin";
    let rows = q("SELECT * FROM peserta ORDER BY tgl_transaksi DESC, id DESC");
    if(searchTerm.trim()){
      const s = searchTerm.trim().toLowerCase();
      rows = rows.filter(r =>
        (r.nama_alumni||"").toLowerCase().includes(s) ||
        (r.nama_pengirim||"").toLowerCase().includes(s) ||
        (r.no_transaksi||"").toLowerCase().includes(s)
      );
    }

    if(rows.length===0){
      wrap.innerHTML = `<div class="empty-state">
        <div class="big">Belum ada catatan</div>
        <div>${isAdmin ? 'Klik "Tambah Data" untuk mencatat pembayaran pertama.' : 'Data pembayaran akan tampil di sini setelah dicatat oleh admin.'}</div>
      </div>`;
      return;
    }

    wrap.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Nama Alumni</th>
            <th>Nama Pengirim</th>
            <th>Tgl Transaksi</th>
            <th>Tgl Kirim ke WAG</th>
            <th>No. Transaksi</th>
            <th class="num">Total Bayar</th>
            <th class="num">Jml Peserta</th>
            <th>Bukti Bayar</th>
            <th>Diinput Oleh</th>
            <th>Update Terakhir</th>
            ${isAdmin ? '<th>Aksi</th>' : ''}
          </tr>
        </thead>
        <tbody>
          ${rows.map(r=>`
            <tr>
              <td>${escapeHtml(r.nama_alumni)}</td>
              <td>${escapeHtml(r.nama_pengirim||'-')}</td>
              <td class="num">${fmtDate(r.tgl_transaksi)}</td>
              <td class="num">${fmtDate(r.tgl_kirim_wag)}</td>
              <td class="mono">${escapeHtml(r.no_transaksi||'-')}</td>
              <td class="num">${fmtRupiah(r.total_pembayaran)}</td>
              <td class="num">${r.total_peserta}</td>
              <td>${r.has_attachment ? `<button class="attach-btn" onclick="window.__viewAttach(${r.id})">👁️ Lihat</button>` : `<span class="no-attach">Tidak ada</span>`}</td>
              <td class="who-cell">${escapeHtml(r.created_by || '-')}<br><span style="opacity:.7">${fmtDate((r.created_at||'').slice(0,10))}</span></td>
              <td class="who-cell">${escapeHtml(r.updated_by || '-')}<br><span style="opacity:.7">${fmtDate((r.updated_at||'').slice(0,10))}</span></td>
              ${isAdmin ? `<td class="actions">
                <button class="icon-btn edit" title="Edit" onclick="window.__editRow(${r.id})">✏️</button>
                <button class="icon-btn del" title="Hapus" onclick="window.__delRow(${r.id})">🗑️</button>
              </td>` : ''}
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;
  }

  function renderManageUsers(){
    const box = document.getElementById("manageUsersBox");
    if(!box) return;
    const users = q("SELECT * FROM users ORDER BY role DESC, username");
    box.innerHTML = `
      <h3>👤 Kelola User Login</h3>
      ${users.map(u=>`
        <div class="user-row">
          <span><b>${escapeHtml(u.username)}</b> &middot; ${u.role==='admin'?'Admin':'User biasa (lihat saja)'}</span>
          <span>
            <button class="btn btn-ghost btn-sm" onclick="window.__resetPass(${u.id}, '${escapeHtml(u.username)}')">Ganti Password</button>
            ${users.filter(x=>x.role==='admin').length>1 || u.role!=='admin' ? `<button class="btn btn-danger btn-sm" onclick="window.__delUser(${u.id}, '${escapeHtml(u.username)}')">Hapus</button>` : ''}
          </span>
        </div>
      `).join("")}
      <form id="addUserForm" style="margin-top:16px; display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;">
        <div class="field" style="margin:0; flex:1; min-width:140px;">
          <label>Username baru</label>
          <input type="text" id="newUserName" required>
        </div>
        <div class="field" style="margin:0; flex:1; min-width:140px;">
          <label>Password</label>
          <input type="text" id="newUserPass" required>
        </div>
        <div class="field" style="margin:0; min-width:150px;">
          <label>Role</label>
          <select id="newUserRole">
            <option value="user">User biasa (lihat saja)</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <button type="submit" class="btn btn-gold">+ Tambah User</button>
      </form>
    `;
    document.getElementById("addUserForm").addEventListener("submit", (e)=>{
      e.preventDefault();
      const uname = document.getElementById("newUserName").value.trim();
      const pass = document.getElementById("newUserPass").value;
      const role = document.getElementById("newUserRole").value;
      if(!uname || !pass) return;
      const exists = q("SELECT id FROM users WHERE username=?", [uname]);
      if(exists.length){ toast("⚠️ Username sudah digunakan"); return; }
      run("INSERT INTO users(username,password,role) VALUES (?,?,?)", [uname,pass,role]);
      persist();
      toast("✅ User ditambahkan");
      renderManageUsers();
    });
  }

  window.__resetPass = function(id, uname){
    const np = prompt(`Password baru untuk "${uname}":`);
    if(np===null) return;
    if(np.trim()===""){ toast("⚠️ Password tidak boleh kosong"); return; }
    run("UPDATE users SET password=? WHERE id=?", [np, id]);
    persist();
    toast("✅ Password diperbarui");
  };
  window.__delUser = function(id, uname){
    if(!confirm(`Hapus user "${uname}"?`)) return;
    run("DELETE FROM users WHERE id=?", [id]);
    persist();
    toast("🗑️ User dihapus");
    renderManageUsers();
  };

  // ---------------- ATTACHMENT LIGHTBOX (langsung pop up) ----------------
  window.__viewAttach = async function(id){
    const row = q("SELECT attachment_name FROM peserta WHERE id=?", [id])[0];
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.id = "attachOverlay";
    overlay.innerHTML = `
      <div class="modal">
        <button class="close-x" id="closeAttach">✕</button>
        <h3 class="display">Bukti Pembayaran</h3>
        <div class="modal-sub">${escapeHtml(row ? row.attachment_name || '' : '')}</div>
        <div class="attach-view" id="attachViewBody"><div style="padding:40px; color:var(--ink-soft);">Memuat lampiran...</div></div>
      </div>
    `;
    document.body.appendChild(overlay);
    document.getElementById("closeAttach").addEventListener("click", ()=>overlay.remove());
    overlay.addEventListener("click",(e)=>{ if(e.target===overlay) overlay.remove(); });

    try{
      const res = await window.storage.get(attachKey(id), true);
      const body = document.getElementById("attachViewBody");
      if(!body) return; // modal already closed
      if(!res || !res.value){
        body.innerHTML = `<div style="padding:30px; color:var(--ink-soft);">Lampiran tidak ditemukan.</div>`;
        return;
      }
      const dataUrl = res.value;
      if(dataUrl.startsWith("data:image")){
        body.innerHTML = `<img src="${dataUrl}" alt="Bukti pembayaran">
          <div class="meta">${escapeHtml(row?row.attachment_name||'':'')}</div>
          <div style="margin-top:12px;"><a class="btn btn-ghost btn-sm" href="${dataUrl}" download="${escapeHtml(row?row.attachment_name||'bukti':'bukti')}">⬇ Unduh</a></div>`;
      }else if(dataUrl.startsWith("data:application/pdf")){
        body.innerHTML = `<embed src="${dataUrl}" type="application/pdf">
          <div style="margin-top:12px;"><a class="btn btn-ghost btn-sm" href="${dataUrl}" download="${escapeHtml(row?row.attachment_name||'bukti':'bukti')}">⬇ Unduh</a></div>`;
      }else{
        body.innerHTML = `<div style="padding:20px;">Pratinjau tidak didukung untuk jenis file ini.</div>
          <a class="btn btn-primary btn-sm" href="${dataUrl}" download="${escapeHtml(row?row.attachment_name||'bukti':'bukti')}">⬇ Unduh File</a>`;
      }
    }catch(e){
      console.error(e);
      const body = document.getElementById("attachViewBody");
      if(body) body.innerHTML = `<div style="padding:30px; color:var(--maroon-dark);">Gagal memuat lampiran.</div>`;
    }
  };

  // ---------------- ACTIVITY LOG ----------------
  function openActivityLog(){
    const logs = q("SELECT * FROM activity_log ORDER BY id DESC LIMIT 300");
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.id = "logOverlay";
    overlay.innerHTML = `
      <div class="modal wide">
        <button class="close-x" id="closeLog">✕</button>
        <h3 class="display">🕒 Log Aktivitas</h3>
        <div class="modal-sub">Riwayat siapa yang menambah, mengubah, atau menghapus data.</div>
        <div class="log-scroll">
          <table class="log-table">
            <thead>
              <tr><th>Waktu</th><th>User</th><th>Aksi</th><th>Nama Alumni</th><th>Keterangan</th></tr>
            </thead>
            <tbody>
              ${logs.length===0 ? `<tr><td colspan="5" style="text-align:center; padding:24px; color:var(--ink-soft);">Belum ada aktivitas tercatat.</td></tr>` :
              logs.map(l=>`
                <tr>
                  <td class="mono" style="white-space:nowrap;">${fmtDateTime(l.ts)}</td>
                  <td>${escapeHtml(l.username)}</td>
                  <td><span class="log-action ${l.action==='Tambah'?'tambah':l.action==='Hapus'?'hapus':'update'}">${escapeHtml(l.action)}</span></td>
                  <td>${escapeHtml(l.nama_alumni||'-')}</td>
                  <td style="color:var(--ink-soft);">${escapeHtml(l.detail||'-')}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="closeLog2">Tutup</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    const close = ()=>overlay.remove();
    document.getElementById("closeLog").addEventListener("click", close);
    document.getElementById("closeLog2").addEventListener("click", close);
    overlay.addEventListener("click",(e)=>{ if(e.target===overlay) close(); });
  }

  // ---------------- MODAL: TAMBAH / EDIT ----------------
  function openModal(id){
    pendingAttachment = null;
    let data = { nama_alumni:"", nama_pengirim:"", tgl_transaksi:"", tgl_kirim_wag:"", no_transaksi:"", total_pembayaran:"", total_peserta:1, has_attachment:0, attachment_name:"" };
    if(id){
      const r = q("SELECT * FROM peserta WHERE id=?",[id])[0];
      if(r) data = r;
    }
    const overlay = document.createElement("div");
    overlay.className = "overlay";
    overlay.id = "modalOverlay";
    overlay.innerHTML = `
      <div class="modal">
        <button class="close-x" id="closeModal">✕</button>
        <h3 class="display">${id? "Edit Data Peserta" : "Tambah Data Peserta"}</h3>
        <div class="modal-sub">Lengkapi data pembayaran peserta reuni alumni SMP 66 Angkatan 1996.</div>
        <form id="dataForm">
          <div class="grid2">
            <div class="field" style="grid-column:1/-1;">
              <label>Nama Alumni *</label>
              <input type="text" id="f_nama_alumni" value="${escapeHtml(data.nama_alumni)}" required>
            </div>
            <div class="field">
              <label>Nama Pengirim</label>
              <input type="text" id="f_nama_pengirim" value="${escapeHtml(data.nama_pengirim||'')}">
            </div>
            <div class="field">
              <label>No. Transaksi Pembayaran</label>
              <input type="text" id="f_no_transaksi" value="${escapeHtml(data.no_transaksi||'')}">
            </div>
            <div class="field">
              <label>Tgl Transaksi Pembayaran</label>
              <input type="date" id="f_tgl_transaksi" value="${data.tgl_transaksi||''}">
            </div>
            <div class="field">
              <label>Tgl Pengiriman Bukti ke WAG</label>
              <input type="date" id="f_tgl_kirim_wag" value="${data.tgl_kirim_wag||''}">
            </div>
            <div class="field">
              <label>Total Pembayaran (Rp)</label>
              <input type="number" id="f_total_pembayaran" min="0" step="1000" value="${data.total_pembayaran||''}">
            </div>
            <div class="field">
              <label>Total Peserta</label>
              <input type="number" id="f_total_peserta" min="1" step="1" value="${data.total_peserta||1}">
            </div>
            <div class="field" style="grid-column:1/-1;">
              <label>Attachment Bukti Pembayaran (gambar/PDF, maks ±1.5MB)</label>
              <input type="file" id="f_attachment" accept="image/*,application/pdf">
              <div class="file-preview" id="filePreview">${data.has_attachment ? `File saat ini: ${escapeHtml(data.attachment_name||'terlampir')}` : 'Belum ada file dipilih'}</div>
            </div>
          </div>
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" id="cancelModal">Batal</button>
            <button type="submit" class="btn btn-primary" id="submitModalBtn">${id? 'Simpan Perubahan':'Simpan Data'}</button>
          </div>
        </form>
      </div>
    `;
    document.body.appendChild(overlay);
    document.getElementById("closeModal").addEventListener("click", closeModal);
    document.getElementById("cancelModal").addEventListener("click", closeModal);
    overlay.addEventListener("click",(e)=>{ if(e.target===overlay) closeModal(); });

    document.getElementById("f_attachment").addEventListener("change",(e)=>{
      const file = e.target.files[0];
      if(!file) return;
      if(file.size > 1.5*1024*1024){
        toast("⚠️ File terlalu besar, gunakan file di bawah ±1.5MB");
        e.target.value = "";
        return;
      }
      const reader = new FileReader();
      reader.onload = ()=>{
        pendingAttachment = { name: file.name, dataUrl: reader.result };
        document.getElementById("filePreview").textContent = "File dipilih: " + file.name;
      };
      reader.readAsDataURL(file);
    });

    document.getElementById("dataForm").addEventListener("submit", async (e)=>{
      e.preventDefault();
      const submitBtn = document.getElementById("submitModalBtn");
      submitBtn.disabled = true;
      submitBtn.textContent = "Menyimpan...";

      const payload = {
        nama_alumni: document.getElementById("f_nama_alumni").value.trim(),
        nama_pengirim: document.getElementById("f_nama_pengirim").value.trim(),
        tgl_transaksi: document.getElementById("f_tgl_transaksi").value,
        tgl_kirim_wag: document.getElementById("f_tgl_kirim_wag").value,
        no_transaksi: document.getElementById("f_no_transaksi").value.trim(),
        total_pembayaran: parseFloat(document.getElementById("f_total_pembayaran").value)||0,
        total_peserta: parseInt(document.getElementById("f_total_peserta").value)||1,
      };
      if(!payload.nama_alumni){
        toast("⚠️ Nama alumni wajib diisi");
        submitBtn.disabled = false; submitBtn.textContent = id? 'Simpan Perubahan':'Simpan Data';
        return;
      }

      const who = session.username;

      if(id){
        run(`UPDATE peserta SET nama_alumni=?,nama_pengirim=?,tgl_transaksi=?,tgl_kirim_wag=?,no_transaksi=?,total_pembayaran=?,total_peserta=?,updated_by=?,updated_at=CURRENT_TIMESTAMP WHERE id=?`,
          [payload.nama_alumni,payload.nama_pengirim,payload.tgl_transaksi,payload.tgl_kirim_wag,payload.no_transaksi,payload.total_pembayaran,payload.total_peserta,who,id]);
        if(pendingAttachment){
          try{
            await window.storage.set(attachKey(id), pendingAttachment.dataUrl, true);
            run("UPDATE peserta SET has_attachment=1, attachment_name=? WHERE id=?", [pendingAttachment.name, id]);
          }catch(e){ console.error(e); toast("⚠️ Gagal menyimpan lampiran"); }
        }
        logActivity("Update", payload.nama_alumni, `Total bayar ${fmtRupiah(payload.total_pembayaran)}`);
        toast("✅ Data berhasil diperbarui");
      }else{
        run(`INSERT INTO peserta(nama_alumni,nama_pengirim,tgl_transaksi,tgl_kirim_wag,no_transaksi,total_pembayaran,total_peserta,created_by,updated_by) VALUES (?,?,?,?,?,?,?,?,?)`,
          [payload.nama_alumni,payload.nama_pengirim,payload.tgl_transaksi,payload.tgl_kirim_wag,payload.no_transaksi,payload.total_pembayaran,payload.total_peserta,who,who]);
        const newId = q("SELECT last_insert_rowid() as id")[0].id;
        if(pendingAttachment){
          try{
            await window.storage.set(attachKey(newId), pendingAttachment.dataUrl, true);
            run("UPDATE peserta SET has_attachment=1, attachment_name=? WHERE id=?", [pendingAttachment.name, newId]);
          }catch(e){ console.error(e); toast("⚠️ Gagal menyimpan lampiran"); }
        }
        logActivity("Tambah", payload.nama_alumni, `Total bayar ${fmtRupiah(payload.total_pembayaran)}`);
        toast("✅ Data berhasil ditambahkan");
      }

      await persist();
      closeModal();
      renderDashboard();
    });
  }

  function closeModal(){
    const o = document.getElementById("modalOverlay");
    if(o) o.remove();
    pendingAttachment = null;
  }

  window.__editRow = function(id){ openModal(id); };
  window.__delRow = async function(id){
    const r = q("SELECT nama_alumni FROM peserta WHERE id=?",[id])[0];
    if(!confirm(`Hapus data pembayaran "${r?r.nama_alumni:''}"?`)) return;
    try{ await window.storage.delete(attachKey(id), true); }catch(e){ /* mungkin tidak ada lampiran, abaikan */ }
    run("DELETE FROM peserta WHERE id=?",[id]);
    logActivity("Hapus", r ? r.nama_alumni : "", "Data dihapus dari daftar");
    await persist();
    toast("🗑️ Data dihapus");
    renderDashboard();
  };

  // ---------------- BOOT ----------------
  async function boot(){
    app.innerHTML = `<div class="login-wrap"><div style="text-align:center; color:var(--ink-soft);">Memuat database...</div></div>`;
    await initDb();
    renderLogin();
  }
  boot();
})();
</script>
</body>
</html>
